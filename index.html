<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#121110;
    --surface:#1B1917;
    --surface-2:#221F1D;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);
    --text:#F6F3EE;
    --text-muted:#9C968D;
    --accent:#cdf71b;
    --accent-ink:#171310;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);height:100%;overflow:hidden;}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--text);}
  a,button{color:inherit;text-decoration:none;font-family:inherit;}
  button{cursor:pointer;background:none;border:none;}
  input,textarea{font-family:'Manrope',sans-serif;color:var(--text);}
  input::placeholder,textarea::placeholder{color:var(--text-muted);}
  #shell{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;}
  #app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(22px + env(safe-area-inset-top,0px)) 22px 20px;display:flex;flex-direction:column;gap:20px;}
  .hd{flex:0 0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 22px 4px;display:flex;align-items:center;gap:12px;}
  .icon-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex:0 0 auto;}
  .icon-btn.bordered{background:var(--surface);border:1px solid var(--border-strong);}
  .title-lg{font:700 26px/1.2 'Space Grotesk';}
  .title-md{font:700 20px/1.2 'Space Grotesk';}
  .muted{color:var(--text-muted);}
  .label{font:700 11px/1 'Manrope';letter-spacing:.07em;color:var(--text-muted);display:block;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;}
  .field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:13px;padding:14px 16px;width:100%;}
  .textinput{width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:13px;padding:14px 16px;font-size:15px;}
  .btn-primary{display:block;text-align:center;width:100%;padding:16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 16px/1 'Manrope';border:none;}
  .btn-ghost{display:block;text-align:center;width:100%;padding:14px;border-radius:13px;background:transparent;border:1.5px dashed var(--border-strong);color:var(--text);font:600 14px/1 'Manrope';}
  .footer{flex:0 0 auto;padding:14px 22px calc(24px + env(safe-area-inset-bottom,0px));}
  nav.bottom{flex:0 0 auto;display:flex;justify-content:space-around;padding:12px 8px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--bg);}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text-muted);}
  nav.bottom a.on{color:var(--accent);}
  nav.bottom span{font:700 10px/1 'Manrope';letter-spacing:.05em;}
  .opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--border-strong);background:var(--surface);text-align:left;}
  .opt.on{border-color:var(--accent);}
  .opt.on span{color:var(--accent);font-weight:700;}
  .dot5{display:flex;gap:6px;}
  .dot5 i{width:6px;height:6px;border-radius:50%;background:var(--border-strong);display:block;}
  .dot5 i.on{background:var(--accent);}
  .pillrow{display:inline-flex;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border-strong);font:700 12px/1 'Manrope';color:var(--accent);}
  .toggle2{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;}
  .toggle2 .seg{flex:1;text-align:center;padding:9px 0;border-radius:9px;font:600 13px/1 'Manrope';color:var(--text-muted);}
  .toggle2 .seg.on{background:var(--surface-2);font-weight:700;color:var(--text);}
  .msg{font:600 13px/1.4 'Manrope';color:var(--accent);}
  textarea.plain{resize:none;background:transparent;border:none;outline:none;width:100%;}
</style>
</head>
<body>
<div id="shell"><div id="app"></div></div>

<script>
/* ---------- utils ---------- */
function toISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
function fromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfDay(d){ const r=new Date(d); r.setHours(0,0,0,0); return r; }
const WD_LONG=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const WD_SHORT=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function mondayOnOrBefore(d){ const r=startOfDay(d); const dow=r.getDay(); const diff=(dow===0)?-6:(1-dow); return addDays(r,diff); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function isSlotDay(d){ const dow=d.getDay(); return dow===1||dow===3||dow===6; }

/* ---------- data ---------- */
const STORAGE_KEY='mm_calendario_v1';
const DEFAULT_FORMATS=['POV (visão do aluno)','Vídeo explicativo','Vídeo narrado','Carrossel de fotos','Vídeo curto com título','Apresentador','Entrevista','Vídeo com música','Vídeo áudio podcast'];
const PILARES=['Metodologia','Inspiracional','Ambiente','Equipe'];

function suggestedPilarForDate(iso){
  const dow=fromISO(iso).getDay();
  if(dow===1) return 'Metodologia';
  if(dow===3) return 'Inspiracional';
  if(dow===6) return 'Ambiente';
  return PILARES[0];
}

function loadRaw(){
  try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
let DATA = loadRaw();
if(!DATA){
  DATA = { customFormats:[], posts:[] };
  saveData();
}
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){ console.error('save failed', e); } }
function gfMarkSrc(){ const f=document.getElementById('favicon'); return f ? f.href : ''; }
function allFormats(){ return DEFAULT_FORMATS.concat(DATA.customFormats||[]); }
function findPost(id){ return DATA.posts.find(p=>p.id===id); }

/* ---------- state ---------- */
let VIEW = 'hoje';
let CTX = { mesMode:'lista', mesMonth:new Date().getFullYear()+'-'+new Date().getMonth(), semanaStart: mondayOnOrBefore(new Date()) };
let downloadsCap = null;
if(window.claude && window.claude.use){
  window.claude.use('downloads').then(c=>{ downloadsCap = c; }).catch(()=>{});
}

function go(view, extra){ VIEW=view; if(extra) Object.assign(CTX, extra); render(); }

function buildMonthRows(year, monthIdx){
  const first=new Date(year,monthIdx,1);
  const last=new Date(year,monthIdx+1,0);
  let ws=mondayOnOrBefore(first);
  const rows=[];
  while(ws<=last){
    rows.push({mon:ws, wed:addDays(ws,2), sat:addDays(ws,5)});
    ws=addDays(ws,7);
  }
  return rows;
}

function mesCell(d, monthIdx){
  const inMonth = d.getMonth()===monthIdx;
  if(!inMonth) return '<div></div>';
  const iso=toISO(d);
  const post=DATA.posts.find(p=>p.date===iso);
  const isToday = iso===toISO(startOfDay(new Date()));
  if(post){
    return '<a href="#" data-action="open-post" data-id="'+post.id+'" style="background:var(--surface);border:1px solid '+(isToday?'var(--accent)':'var(--border)')+';border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:6px;min-height:118px;">'
      +'<div style="font:700 12px/1 \'Manrope\';color:'+(isToday?'var(--accent)':'var(--text-muted)')+';">'+d.getDate()+(isToday?' · hoje':'')+'</div>'
      +'<div style="font:800 9.5px/1 \'Manrope\';letter-spacing:.05em;color:var(--accent);">'+esc(post.pilar.toUpperCase())+'</div>'
      +'<div style="font:600 13px/1.32 \'Space Grotesk\';display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">'+esc(post.tema)+'</div>'
      +'</a>';
  }
  return '<a href="#" data-action="criar-for-date" data-date="'+iso+'" style="border:1px dashed var(--border-strong);border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:6px;min-height:118px;justify-content:space-between;">'
    +'<div style="font:700 12px/1 \'Manrope\';color:var(--text-muted);">'+d.getDate()+'</div>'
    +'<span class="muted">'+ICO.plus+'</span></a>';
}

function viewMes(){
  const [y,m]=CTX.mesMonth.split('-').map(Number);
  const monthLabel=cap(MONTHS[m])+' de '+y;
  const toggle='<div class="toggle2">'
    +'<button data-action="mes-mode" data-mode="lista" class="seg '+(CTX.mesMode==='lista'?'on':'')+'">Lista</button>'
    +'<button data-action="mes-mode" data-mode="calendario" class="seg '+(CTX.mesMode==='calendario'?'on':'')+'">Calendário</button>'
    +'</div>';
  const header='<div style="display:flex;align-items:center;justify-content:space-between;">'
    +'<button data-action="mes-prev" class="icon-btn bordered">'+ICO.back+'</button>'
    +'<div class="title-md">'+monthLabel+'</div>'
    +'<button data-action="mes-next" class="icon-btn bordered">'+ICO.chevR+'</button>'
    +'</div>';

  let content;
  if(CTX.mesMode==='lista'){
    const rows=buildMonthRows(y,m);
    const blocks=rows.map(function(r){
      const items=[['SEG',r.mon],['QUA',r.wed],['SÁB',r.sat]].filter(function(it){ return it[1].getMonth()===m; });
      if(!items.length) return '';
      const lines=items.map(function(it){
        const iso=toISO(it[1]);
        const post=DATA.posts.find(p=>p.date===iso);
        if(post) return '<a href="#" data-action="open-post" data-id="'+post.id+'" class="row" style="display:flex;align-items:center;gap:9px;padding:6px 0;">'
          +'<div style="flex:0 0 auto;width:30px;font:700 11px/1 \'Manrope\';color:var(--text-muted);">'+it[0]+'</div>'
          +'<div style="flex:0 0 auto;font:700 12px/1 \'Manrope\';color:var(--accent);">'+esc(post.pilar)+'</div>'
          +'<div style="flex:1;min-width:0;font:500 12px/1 \'Manrope\';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(post.tema)+'</div></a>';
        return '<a href="#" data-action="criar-for-date" data-date="'+iso+'" style="display:flex;align-items:center;gap:9px;padding:6px 0;">'
          +'<div style="flex:0 0 auto;width:30px;font:700 11px/1 \'Manrope\';color:var(--text-muted);">'+it[0]+'</div>'
          +'<div class="muted" style="font:600 12px/1 \'Manrope\';">Sem post — criar</div></a>';
      }).join('');
      return '<div class="card" style="display:flex;flex-direction:column;gap:2px;">'
        +'<div class="label" style="margin-bottom:6px;">SEMANA DE '+r.mon.getDate()+' A '+r.sat.getDate()+'</div>'+lines+'</div>';
    }).join('');
    content = blocks || '<div class="muted">Sem semanas neste mês.</div>';
  } else {
    const rows=buildMonthRows(y,m);
    content = '<div style="display:grid;grid-template-columns:repeat(3,1fr);"><div class="label" style="text-align:center;">SEG</div><div class="label" style="text-align:center;">QUA</div><div class="label" style="text-align:center;">SÁB</div></div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">'
      +rows.map(function(r){ return mesCell(r.mon,m)+mesCell(r.wed,m)+mesCell(r.sat,m); }).join('')
      +'</div>';
  }

  return '<div class="screen"><div class="scroll">'+header+toggle+content+'</div>'+bottomNavHTML('mes')+'</div>';
}

function upcomingOpenDates(limit){
  const out=[];
  let dt=startOfDay(new Date());
  while(out.length<limit){
    if(isSlotDay(dt) && !DATA.posts.find(function(p){ return p.date===toISO(dt); })) out.push(new Date(dt));
    dt=addDays(dt,1);
  }
  return out;
}

      +'<span class="label">Legenda</span>'
      +'<textarea id="criarLegendaInput" rows="4" class="plain" placeholder="Escreva a legenda que vai junto com o post." style="margin-top:10px;font-size:14.5px;line-height:1.55;">'+esc(d.legenda)+'</textarea>';
    footer = '<a href="#" data-action="criar-finish" class="btn-primary">Concluir</a>';
  }

  const isFirstVisible = step===1 || (step===2 && CTX.dateLocked);
  const backAction = isFirstVisible ? 'nav-hoje' : 'criar-back';
  return '<div class="screen">'
    +criarHeader(step, backAction)
    +'<div class="scroll" style="gap:22px;flex-direction:column;display:flex;">'+body+'</div>'
    +'<div class="footer">'+footer+'</div>'
    +'</div>';
}

/* ---- editar ---- */
function viewEditar(){
  const p=CTX.editDraft;
  const fmts=allFormats();
  return '<div class="screen">'
    +'<div class="hd">'
    +'<a href="#" data-action="editar-back" class="icon-btn bordered">'+ICO.back+'</a>'
    +'<div><div class="title-md">Editar post</div><div class="muted" style="font:600 12px/1 \'Manrope\';margin-top:3px;">'+WD_SHORT[fromISO(p.date).getDay()]+' · '+fromISO(p.date).getDate()+' de '+MONTHS[fromISO(p.date).getMonth()]+'</div></div>'
    +'</div>'
    +'<div class="scroll">'

    +'<div><span class="label">Pilar</span>'
    +'<button data-action="toggle-picker" data-which="pilar" class="field" style="margin-top:11px;"><span style="font:700 15px/1 \'Manrope\';color:var(--accent);">'+esc(p.pilar)+'</span>'+ICO.chevDown+'</button>'
    +(CTX.editPicker==='pilar' ? '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">'+PILARES.map(function(x){
        return '<button data-action="set-edit" data-field="pilar" data-value="'+esc(x)+'" class="opt '+(p.pilar===x?'on':'')+'"><span>'+esc(x)+'</span></button>';
      }).join('')+'</div>' : '')
    +'</div>'

    +'<div><span class="label">Formato</span>'
    +'<button data-action="toggle-picker" data-which="formato" class="field" style="margin-top:11px;"><span style="font:600 15px/1 \'Manrope\';">'+esc(p.formato)+'</span>'+ICO.chevDown+'</button>'
    +(CTX.editPicker==='formato' ? '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">'+fmts.map(function(x){
        return '<button data-action="set-edit" data-field="formato" data-value="'+esc(x)+'" class="opt '+(p.formato===x?'on':'')+'"><span>'+esc(x)+'</span></button>';
      }).join('')
      + (CTX.addingFormat
          ? '<div style="display:flex;gap:8px;"><input id="novoFormatoInput" type="text" placeholder="Nome do formato" class="textinput" style="flex:1;"><button data-action="edit-add-format-confirm" class="icon-btn bordered">'+ICO.check+'</button></div>'
          : '<button data-action="criar-add-format-toggle" class="opt" style="border-style:dashed;background:transparent;"><span style="display:flex;align-items:center;gap:9px;color:var(--text-muted);font-weight:700;">'+ICO.plus+' Adicionar formato</span></button>')
      +'</div>' : '')
    +'</div>'

    +'<div><span class="label">Tema</span><input id="editTema" type="text" value="'+esc(p.tema)+'" class="textinput" style="margin-top:11px;"></div>'

    +'<div><span class="label">Inspiração</span><div class="field" style="margin-top:11px;">'+ICO.link+'<input id="editInsp" type="text" value="'+esc(p.inspiracao)+'" placeholder="Cole o link aqui" style="flex:1;min-width:0;background:transparent;border:none;outline:none;font-size:14px;"></div></div>'

    +'<div><span class="label">Roteiro</span><a href="#" data-action="open-roteiro" data-id="'+p.id+'" data-back="editar" class="field" style="margin-top:11px;"><span style="font:600 15px/1 \'Manrope\';">Abrir roteiro</span>'+ICO.chevR+'</a></div>'

    +'<a href="#" data-action="delete-post" data-id="'+p.id+'" style="display:flex;align-items:center;gap:8px;color:var(--text-muted);margin-top:4px;">'+ICO.trash+'<span style="font:600 13px/1 \'Manrope\';">'+(CTX.confirmDelete?'Toque de novo para confirmar':'Excluir post')+'</span></a>'

    +'</div>'
    +'<div class="footer"><a href="#" data-action="save-editar" class="btn-primary">Salvar</a></div>'
    +'</div>';
}

/* ---- roteiro ---- */
function viewRoteiro(){
  const p=findPost(CTX.roteiroId);
  if(!p) return viewHoje();
  const d=fromISO(p.date);
  return '<div class="screen">'
    +'<div class="hd" style="justify-content:space-between;">'
    +'<a href="#" data-action="roteiro-back" class="icon-btn" aria-label="Voltar">'+ICO.back+'</a>'
    +'<div class="muted" style="font:600 13px/1 \'Manrope\';flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;">'+WD_SHORT[d.getDay()]+' · '+esc(p.tema)+'</div>'
    +'<a href="#" data-action="roteiro-save" style="color:var(--accent);" class="icon-btn" aria-label="Salvar">'+ICO.check+'</a>'
    +'</div>'
    +'<div class="scroll" style="padding-top:6px;">'
    +(p.inspiracao ? '<a href="'+esc(p.inspiracao)+'" target="_blank" rel="noopener" class="muted" style="display:inline-flex;align-items:center;gap:7px;align-self:flex-start;">'+ICO.link+'<span style="font:600 12.5px/1 \'Manrope\';">Ver inspiração</span></a>' : '')
    +'<textarea id="roteiroFala" class="plain" placeholder="Escreva aqui a fala completa, do jeito que vai ser gravado." style="flex:1;min-height:260px;font-size:16.5px;line-height:1.65;">'+esc(p.roteiro)+'</textarea>'
    +'<div style="height:1px;background:var(--border);margin:8px 0 18px;"></div>'
    +'<span class="label">Legenda</span>'
    +'<textarea id="roteiroLegenda" rows="4" class="plain" placeholder="Escreva a legenda que vai junto com o post." style="margin-top:10px;font-size:14.5px;line-height:1.55;">'+esc(p.legenda)+'</textarea>'
    +'</div></div>';
}

/* ---- ajustes ---- */
function viewAjustes(){
  return '<div class="screen">'
    +'<div class="hd"><a href="#" data-action="nav-hoje" class="icon-btn bordered">'+ICO.back+'</a><div class="title-md">Ajustes</div></div>'
    +'<div class="scroll">'
    +'<div class="card" style="display:flex;flex-direction:column;gap:12px;">'
    +'<div style="font:700 16px/1 \'Space Grotesk\';">Backup</div>'
    +'<div class="muted" style="font-size:13px;">Baixe um arquivo com todo o planejamento, ou importe um backup salvo antes.</div>'
    +'<button data-action="do-backup" class="btn-primary" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);">Baixar backup</button>'
    +'<label class="btn-ghost" style="display:block;cursor:pointer;">Importar planejamento<input id="importFile" type="file" accept="application/json" style="display:none;"></label>'
    +(CTX.backupMsg ? '<div class="msg">'+esc(CTX.backupMsg)+'</div>' : '')
    +'</div>'
    +'<div class="card" style="display:flex;flex-direction:column;gap:10px;">'
    +'<div style="font:700 16px/1 \'Space Grotesk\';">Começar do zero</div>'
    +'<div class="muted" style="font-size:13px;">Apaga todos os posts salvos neste aparelho. Não afeta nenhum outro dispositivo.</div>'
    +'<a href="#" data-action="reset-all" style="color:'+(CTX.confirmReset?'var(--accent)':'var(--text-muted)')+';font:700 13px/1 \'Manrope\';">'+(CTX.confirmReset?'Toque de novo para confirmar':'Apagar tudo')+'</a>'
    +'</div>'
    +'</div></div>';
}

/* ---------- render ---------- */
function render(){
  let html;
  if(VIEW==='hoje') html=viewHoje();
  else if(VIEW==='semana') html=viewSemana();
  else if(VIEW==='mes') html=viewMes();
  else if(VIEW==='criar') html=viewCriar();
  else if(VIEW==='editar') html=viewEditar();
  else if(VIEW==='roteiro') html=viewRoteiro();
  else if(VIEW==='ajustes') html=viewAjustes();
  else html=viewHoje();
  document.getElementById('app').innerHTML=html;
  if(VIEW==='importFileBind'){} // no-op
  const fileInput=document.getElementById('importFile');
  if(fileInput) fileInput.addEventListener('change', onImportFile);
}

function syncEditDraftFromDOM(){
  if(VIEW!=='editar' || !CTX.editDraft) return;
  const t=document.getElementById('editTema');
  const i=document.getElementById('editInsp');
  if(t) CTX.editDraft.tema=t.value;
  if(i) CTX.editDraft.inspiracao=i.value;
}

/* ---------- actions ---------- */
function startCriar(dateIso){
  CTX.draft={ date: dateIso || null, pilar: dateIso ? suggestedPilarForDate(dateIso) : PILARES[0], tema:'', formato:DEFAULT_FORMATS[1], inspiracao:'', roteiro:'', legenda:'' };
  CTX.criarStep = dateIso ? 2 : 1;
  CTX.dateLocked = !!dateIso;
  CTX.customDateOpen = false;
  CTX.dateConflict = false;
  CTX.addingFormat=false;
  go('criar');
}

function openPost(id){
  const p=findPost(id);
  if(!p) return;
  CTX.editDraft={ id:p.id, date:p.date, pilar:p.pilar, formato:p.formato, tema:p.tema, inspiracao:p.inspiracao };
  CTX.editPicker=null;
  CTX.addingFormat=false;
  CTX.confirmDelete=false;
  go('editar');
}

function plainDownload(payload){
  try{
    const blob=new Blob([payload], {type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='planejamento-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    CTX.backupMsg='Backup baixado.';
  }catch(e){
    CTX.backupMsg='Não foi possível baixar agora.';
  }
  render();
}
function doBackup(){
  const payload=JSON.stringify(DATA,null,2);
  if(!(window.claude && window.claude.use)){ plainDownload(payload); return; }
  const proceed=function(){
    if(!downloadsCap){ plainDownload(payload); return; }
    downloadsCap.save({filename:'planejamento-backup.json', data:payload}).then(function(){
      CTX.backupMsg='Backup salvo.'; render();
    }).catch(function(err){
      if(err && err.code==='declined'){ CTX.backupMsg='Você cancelou o salvamento.'; render(); return; }
      plainDownload(payload);
    });
  };
  if(!downloadsCap){
    window.claude.use('downloads').then(function(c){ downloadsCap=c; proceed(); }).catch(function(){ plainDownload(payload); });
  } else proceed();
}

function onImportFile(e){
  const file=e.target.files && e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.posts)) throw new Error('formato inválido');
      DATA = { customFormats: parsed.customFormats || [], posts: parsed.posts };
      saveData();
      CTX.backupMsg='Planejamento importado.';
    }catch(err){
      CTX.backupMsg='Não consegui ler esse arquivo.';
    }
    render();
  };
  reader.readAsText(file);
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action], [data-nav]');
  if(!el) return;
  e.preventDefault();

  if(VIEW==='editar' && el.dataset.action!=='save-editar') syncEditDraftFromDOM();

  const nav=el.dataset.nav;
  if(nav==='criar'){ startCriar(); return; }
  if(nav==='hoje'){ go('hoje'); return; }
  if(nav==='semana'){ go('semana'); return; }
  if(nav==='mes'){ go('mes'); return; }
  if(nav==='ajustes'){ CTX.backupMsg=null; CTX.confirmReset=false; go('ajustes'); return; }

  const a=el.dataset.action;
  if(a==='nav-hoje'){ go('hoje'); return; }

  if(a==='open-post'){ openPost(el.dataset.id); return; }

  if(a==='open-roteiro'){
    CTX.roteiroId=el.dataset.id;
    CTX.roteiroBack=el.dataset.back||'hoje';
    go('roteiro'); return;
  }
  if(a==='roteiro-back'){ go(CTX.roteiroBack==='editar' ? 'editar' : CTX.roteiroBack); return; }
  if(a==='roteiro-save'){
    const p=findPost(CTX.roteiroId);
    if(p){
      p.roteiro=document.getElementById('roteiroFala').value;
      p.legenda=document.getElementById('roteiroLegenda').value;
      saveData();
    }
    go(CTX.roteiroBack==='editar' ? 'editar' : CTX.roteiroBack); return;
  }

  if(a==='semana-prev'){ CTX.semanaStart=addDays(CTX.semanaStart,-7); render(); return; }
  if(a==='semana-next'){ CTX.semanaStart=addDays(CTX.semanaStart,7); render(); return; }

  if(a==='mes-mode'){ CTX.mesMode=el.dataset.mode; render(); return; }
  if(a==='mes-prev' || a==='mes-next'){
    let [y,m]=CTX.mesMonth.split('-').map(Number);
    m += (a==='mes-prev'? -1 : 1);
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    CTX.mesMonth=y+'-'+m; render(); return;
  }
  if(a==='criar-for-date'){ startCriar(el.dataset.date); return; }

  if(a==='criar-set'){
    CTX.draft[el.dataset.field]=el.dataset.value;
    if(el.dataset.field==='date'){ CTX.draft.pilar=suggestedPilarForDate(el.dataset.value); }
    render(); return;
  }
  if(a==='criar-add-format-toggle'){ CTX.addingFormat=true; render(); setTimeout(function(){ const i=document.getElementById('novoFormatoInput'); if(i) i.focus(); },0); return; }
  if(a==='criar-add-format-confirm'){
    const i=document.getElementById('novoFormatoInput');
    const v=i && i.value.trim();
    if(v){ DATA.customFormats.push(v); saveData(); if(CTX.draft) CTX.draft.formato=v; if(CTX.editDraft) CTX.editDraft.formato=v; }
    CTX.addingFormat=false; render(); return;
  }
  if(a==='edit-add-format-confirm'){
    const i=document.getElementById('novoFormatoInput');
    const v=i && i.value.trim();
    if(v){ DATA.customFormats.push(v); saveData(); CTX.editDraft.formato=v; }
    CTX.addingFormat=false; render(); return;
  }

  if(a==='criar-custom-date-toggle'){ CTX.customDateOpen=true; CTX.dateConflict=false; render(); return; }

  if(a==='criar-back'){
    const prev=CTX.criarStep-1;
    if(prev<1 || (prev===1 && CTX.dateLocked)){ go('hoje'); return; }
    CTX.criarStep=prev; render(); return;
  }
  if(a==='criar-next'){
    const step=CTX.criarStep;
    if(step===1){
      if(CTX.customDateOpen){
        const custom=document.getElementById('criarDataCustom');
        const v=custom && custom.value;
        if(!v) return;
        const existing=DATA.posts.find(function(p){ return p.date===v; });
        if(existing){ CTX.dateConflict=true; render(); return; }
        CTX.draft.date=v; CTX.draft.pilar=suggestedPilarForDate(v); CTX.dateConflict=false;
      }
      if(!CTX.draft.date){ return; }
    }
    if(step===3){ const v=document.getElementById('criarTemaInput'); CTX.draft.tema = v ? v.value : CTX.draft.tema; }
    if(step===5){ const v=document.getElementById('criarInspInput'); CTX.draft.inspiracao = v ? v.value : CTX.draft.inspiracao; }
    CTX.criarStep=Math.min(6,step+1); CTX.addingFormat=false; render(); return;
  }
  if(a==='criar-skip'){ CTX.criarStep=6; render(); return; }
  if(a==='criar-finish'){
    const fala=document.getElementById('criarFalaInput');
    const leg=document.getElementById('criarLegendaInput');
    const d=CTX.draft;
    d.roteiro = fala ? fala.value : d.roteiro;
    d.legenda = leg ? leg.value : d.legenda;
    DATA.posts = DATA.posts.filter(function(p){ return p.date!==d.date; });
    DATA.posts.push({ id:'p'+Date.now(), date:d.date, pilar:d.pilar, tema:d.tema||'Sem título', formato:d.formato, inspiracao:d.inspiracao, roteiro:d.roteiro, legenda:d.legenda });
    saveData();
    CTX.draft=null;
    go('hoje'); return;
  }

  if(a==='toggle-picker'){ CTX.editPicker = (CTX.editPicker===el.dataset.which) ? null : el.dataset.which; CTX.addingFormat=false; render(); return; }
  if(a==='set-edit'){ CTX.editDraft[el.dataset.field]=el.dataset.value; CTX.editPicker=null; render(); return; }
  if(a==='editar-back'){ go('hoje'); return; }
  if(a==='save-editar'){
    syncEditDraftFromDOM();
    const p=findPost(CTX.editDraft.id);
    if(p){ p.pilar=CTX.editDraft.pilar; p.formato=CTX.editDraft.formato; p.tema=CTX.editDraft.tema; p.inspiracao=CTX.editDraft.inspiracao; saveData(); }
    go('hoje'); return;
  }
  if(a==='delete-post'){
    if(!CTX.confirmDelete){ CTX.confirmDelete=true; render(); return; }
    DATA.posts=DATA.posts.filter(function(p){ return p.id!==el.dataset.id; });
    saveData();
    go('hoje'); return;
  }

  if(a==='reset-all'){
    if(!CTX.confirmReset){ CTX.confirmReset=true; render(); return; }
    DATA={ customFormats:[], posts:[] };
    saveData();
    CTX.confirmReset=false;
    CTX.backupMsg=null;
    go('hoje'); return;
  }
  if(a==='do-backup'){ doBackup(); return; }
});

render();
</script>
</body>
</html>
